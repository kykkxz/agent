[project]
name = "shudao-safety-assistant"
version = "0.1.0"
description = "蜀道安全助手后端服务"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4.1",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "openai>=1.50",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]
rag = [
  "chromadb>=1.0",
  "langchain-chroma>=0.2",
  "langchain-core>=0.3",
  "langchain-huggingface>=0.1",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "transformers>=4.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
